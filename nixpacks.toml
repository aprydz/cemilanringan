[phases.setup]
nixPkgs = ["nodejs_20", "python3"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "DATABASE_URL=\"mysql://user:pass@localhost:3306/dummy\" SHADOW_DATABASE_URL=\"mysql://user:pass@localhost:3306/dummy_shadow\" npx --workspace @piscokshop/api prisma generate",
  "npm run build"
]

[start]
cmd = "npx --workspace @piscokshop/api prisma migrate deploy && node apps/api/dist/server.js"
