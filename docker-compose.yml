services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: piscokshop
      MYSQL_USER: piscokshop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - piscokshop-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  piscokshop-mysql: